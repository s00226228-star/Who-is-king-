function formatThird(t){
  // Avoid arbitrary line breaks: prefer punctuation and phrase boundaries.
  if(t.length<=15)return t;
  const breaks=['、','，','。','て','し、','ながら','から','まで','間、'];
  let best=-1,score=1e9;
  for(let i=5;i<t.length-4;i++){
    const left=t.slice(0,i),right=t.slice(i);
    const isNatural=breaks.some(x=>left.endsWith(x));
    if(!isNatural)continue;
    const penalty=Math.abs(left.length-right.length)+(left.endsWith('て')?3:0);
    if(penalty<score){score=penalty;best=i}
  }
  return best>0?t.slice(0,best)+'\n'+t.slice(best):t;
}

}
