<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#37143d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>王様だ〜れだ</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#2c1831;background:#fdf7f2}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}.screen{display:none;min-height:100dvh}.screen.active{display:flex;flex-direction:column}.home{align-items:center;justify-content:center;gap:22px;padding:30px 24px;background:radial-gradient(ellipse at 50% 20%,#922943 0%,#4b174e 50%,#210f34 100%);color:#fff}.crown{font-size:70px;filter:drop-shadow(0 4px 6px #281024)}h1{font-size:clamp(30px,9vw,43px);margin:0 0 30px;text-align:center}.btn{border:0;border-radius:999px;min-height:58px;padding:13px 24px;font-weight:800;box-shadow:0 5px 0 #ad1951,0 9px 18px #44102b36}.primary{color:#fff;background:linear-gradient(#ff75ad,#ed236c);font-size:21px}.home .btn{width:min(100%,340px)}.secondary{color:#fff;background:#ffffff23;border:2px solid #ffffff65;box-shadow:none;font-size:20px}.secondary:disabled{opacity:.4}.small{font-size:17px}.settings{padding:20px 16px 28px;gap:14px;max-width:560px;margin:auto;width:100%}.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px}.iconbtn{border:0;background:#ffffffa6;border-radius:50%;width:42px;height:42px;font-size:23px;color:#341637}.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 15px #4c21400b}.panel h2{font-size:17px;margin:0 0 14px}.counter{display:flex;justify-content:center;align-items:center;gap:16px}.counter button{border:0;border-radius:50%;width:44px;height:44px;background:#f4edf1;font-size:26px}.counter input{width:86px;text-align:center;border:1px solid #eadce5;border-radius:10px;font-size:25px;font-weight:700;padding:7px}.range{width:100%;accent-color:#f02d7c}.rangeLabels{display:flex;justify-content:space-between;font-size:13px;color:#776773}.muted{color:#867682;font-size:13px;line-height:1.5}.settings .primary{margin-top:auto}.game{background:radial-gradient(ellipse at 50% 70%,#ffe2a7,#fffaf6 70%);padding:16px 18px 36px;align-items:stretch}.game header{display:flex;align-items:center;justify-content:space-between;max-width:600px;width:100%;margin:0 auto}.game header strong{font-size:19px}.reels{display:flex;flex-direction:column;gap:15px;justify-content:center;flex:1;width:100%;max-width:560px;margin:0 auto;padding:30px 0}.reel{height:clamp(96px,16dvh,148px);background:linear-gradient(#d9d0c9,#fff 19%,#fff 81%,#d9d0c9);border:8px ridge #e9a63d;border-radius:25px;box-shadow:0 6px 9px #9d5e2066,inset 0 0 13px #3a1c1a44;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;padding:8px 12px;font-size:clamp(30px,8vw,49px);font-weight:900;color:#26102c}.reel:last-child{height:clamp(125px,21dvh,185px);font-size:clamp(24px,7vw,43px)}.reel.spinning span{animation:scroll .19s linear infinite;filter:blur(2px)}.reel.stopped span{animation:bounce .34s ease-out}.reel span{display:block}@keyframes scroll{0%{transform:translateY(-50px)}100%{transform:translateY(50px)}}@keyframes bounce{0%{transform:translateY(-13px)}55%{transform:translateY(6px)}100%{transform:translateY(0)}}.game .primary{width:min(100%,330px);align-self:center;min-height:76px;font-size:32px}.game .primary:disabled{opacity:.5}.status{text-align:center;color:#81596e;font-size:13px;min-height:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle{accent-color:#f02d7c;width:19px;height:19px}.hide{display:none!important}
</style></head><body>
<section id="home" class="screen home active"><div class="crown">👑</div><h1>王様だ〜れだ</h1><button class="btn primary" id="new">▶ 新ゲーム開始</button><button class="btn secondary" id="resume" disabled>⟳ つづきから</button><button class="btn secondary small" id="homeSettings">⚙ 設定</button></section>
<section id="setup" class="screen settings"><div class="bar"><button class="iconbtn" id="back">‹</button><strong id="settingsTitle">新ゲーム設定</strong><div style="width:42px"></div></div><div class="panel" id="playerPanel"><h2>参加人数（必須）</h2><div class="counter"><button id="minus" aria-label="1人減らす">−</button><input id="players" type="number" min="2" max="99" inputmode="numeric" placeholder="人数" aria-label="参加人数"><button id="plus" aria-label="1人増やす">＋</button></div></div><div class="panel"><h2>難易度</h2><input class="range" id="difficulty" type="range" min="1" max="4" step="1" value="2"><div class="rangeLabels"><span>低</span><span id="levelText">2 / 4</span><span>高</span></div></div><div class="panel"><h2>カテゴリ</h2><p class="muted">お題が決まってから追加します。</p></div><div class="panel"><h2>NG設定</h2><p class="muted">お題が決まってから追加します。</p></div><button class="btn primary" id="start">ゲーム開始</button></section>
<section id="game" class="screen game"><header><button class="iconbtn" id="toHome" aria-label="ホーム">⌂</button><strong>王様だ〜れだ</strong><button class="iconbtn" id="gameSettings" aria-label="設定">⚙</button></header><div class="reels"><div class="reel" id="r0"><span>？番が</span></div><div class="reel" id="r1"><span>？番に</span></div><div class="reel" id="r2"><span>？？？をする</span></div></div><div class="status" id="status">SPINを押してください</div><button class="btn primary" id="action">SPIN</button></section>
<script>
'use strict';
// 仮のお題。正式なお題リストが完成したら差し替える。
const actions=[{id:'p1',text:'ハグをする',type:'pair',level:1},{id:'p2',text:'一緒にポーズを取る',type:'pair',level:1},{id:'p3',text:'握手をする',type:'pair',level:1},{id:'d1',text:'ほめ言葉を伝える',type:'direct',level:1},{id:'d2',text:'質問をする',type:'direct',level:1},{id:'d3',text:'ウインクする',type:'direct',level:2},{id:'s1',text:'変顔をする',type:'solo',level:1},{id:'s2',text:'ダンスをする',type:'solo',level:1},{id:'s3',text:'決めポーズを取る',type:'solo',level:2}];
const $=id=>document.getElementById(id);const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))};const store='ousama-settings-v1';const sessionKey='ousama-session-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(store)||'{}')}catch{};let count=0,phase='idle',stopped=0,result=null,recent=[],tick=null,editMode=false;const rand=n=>Math.floor(Math.random()*n);const setText=(i,t)=>$('r'+i).querySelector('span').textContent=t;
function persist(){localStorage.setItem(store,JSON.stringify({difficulty:+$('difficulty').value}));localStorage.setItem(sessionKey,JSON.stringify({count,recent}))}
function openSetup(edit){editMode=edit;$('settingsTitle').textContent=edit?'設定':'新ゲーム設定';$('playerPanel').classList.toggle('hide',edit);$('start').textContent=edit?'ゲームに戻る':'ゲーム開始';if(!edit)$('players').value='';show('setup')}
$('new').onclick=()=>openSetup(false);$('back').onclick=()=>show(editMode?'game':'home');$('homeSettings').onclick=()=>openSetup(false);$('gameSettings').onclick=()=>openSetup(true);$('toHome').onclick=()=>{clearInterval(tick);document.querySelectorAll('.reel').forEach(x=>x.classList.remove('spinning'));phase='idle';$('action').textContent='SPIN';$('resume').disabled=!count;show('home')};
$('minus').onclick=()=>{$('players').value=Math.max(2,(+$('players').value||3)-1)};$('plus').onclick=()=>{$('players').value=Math.min(99,(+$('players').value||1)+1)};$('difficulty').value=saved.difficulty||2;$('difficulty').oninput=()=>{$('levelText').textContent=$('difficulty').value+' / 4';persist()};$('levelText').textContent=$('difficulty').value+' / 4';
$('start').onclick=()=>{if(editMode){persist();show('game');return}const n=+$('players').value;if(!Number.isInteger(n)||n<2||n>99){alert('参加人数を2〜99人で入力してください');return}count=n;recent=[];phase='idle';stopped=0;['？番が','？番に','？？？をする'].forEach((v,i)=>setText(i,v));$('action').textContent='SPIN';$('status').textContent='SPINを押してください';$('resume').disabled=false;persist();show('game')};
function choose(){const level=+$('difficulty').value;let pool=actions.filter(a=>a.level<=level&&!recent.includes(a.id));if(!pool.length)pool=actions.filter(a=>a.level<=level);if(!pool.length)return null;const weights={pair:45,direct:40,solo:15};const types=[...new Set(pool.map(a=>a.type))];let total=types.reduce((v,t)=>v+weights[t],0),v=Math.random()*total,type=types[0];for(const t of types){v-=weights[t];if(v<0){type=t;break}}const a=pool.filter(x=>x.type===type)[rand(pool.filter(x=>x.type===type).length)];const aNum=1+rand(count);let bNum=1+rand(count-1);if(bNum>=aNum)bNum++;const first=a.type==='pair'?aNum+'番と':aNum+'番が';const second=a.type==='pair'?bNum+'番が':a.type==='direct'?bNum+'番に':'1人で';recent.push(a.id);if(recent.length>20)recent.shift();persist();return[first,second,a.text]}
const samples=[['2番と','5番が','握手をする'],['4番が','1番に','質問をする'],['6番が','1人で','ダンスをする']];
function spin(){result=choose();if(!result){alert('該当するお題がありません');return}stopped=0;phase='spinning';$('action').textContent='STOP';$('status').textContent='タップするたびに上から停止';document.querySelectorAll('.reel').forEach(x=>{x.classList.remove('stopped');x.classList.add('spinning')});let t=0;tick=setInterval(()=>{t++;for(let i=stopped;i<3;i++)setText(i,samples[(t+i)%samples.length][i])},95)}
function stop(){const i=stopped;$('r'+i).classList.remove('spinning');setText(i,result[i]);void $('r'+i).offsetWidth;$('r'+i).classList.add('stopped');stopped++;if(stopped===3){clearInterval(tick);phase='done';$('action').textContent='NEXT';$('status').textContent='結果が決まりました'}}
$('action').onclick=()=>{if(phase==='spinning')stop();else spin()};
try{const s=JSON.parse(localStorage.getItem(sessionKey)||'null');if(s&&Number.isInteger(s.count)&&s.count>=2){count=s.count;recent=Array.isArray(s.recent)?s.recent:[];$('resume').disabled=false}}catch{};$('resume').onclick=()=>{if(!count)return;phase='idle';$('action').textContent='SPIN';$('status').textContent='SPINを押してください';show('game')};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
